[build]
  base = "."
  command = "npm install --prefix client && npm install --prefix server && cd client && npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "server/netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
